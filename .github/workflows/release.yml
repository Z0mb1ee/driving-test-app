name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmtdev1
          python -m pip install --upgrade pip
          python -m pip install kivy==2.3.1 pyinstaller

      - name: Build single-file Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name DrivingTestApp-Linux \
            --add-data "quiz.kv:." \
            --add-data "questions.db:." \
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/DrivingTestApp-Linux
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install kivy==2.3.1 pyinstaller

      - name: Build single-file Windows executable
        timeout-minutes: 30
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DrivingTestApp-Windows `
            --add-data "quiz.kv;." `
            --add-data "questions.db;." `
            --distpath dist `
            --workpath build `
            --specpath spec `
            main.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DrivingTestApp-Windows.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake cmake libffi-dev libltdl-dev libssl-dev \
            libtool make openjdk-17-jdk pkg-config zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0

      - name: Build Android APK
        run: buildozer -v android debug

      - name: Prepare release APK
        run: |
          mkdir -p release-assets
          cp bin/*.apk release-assets/DrivingTestApp-Android-v1.0.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-assets/DrivingTestApp-Android-v1.0.5.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - android
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Driving Test App v1.0.5
          generate_release_notes: true
          files: release-assets/*
